<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aether Drift: Gravimetric Gauntlet</title>
  <style>
    body { margin: 0; padding: 0; background-color: #0d1117; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    #game-container { border: 3px solid #38bdf8; border-radius: 12px; overflow: hidden; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game-container"></div>
  <script>
    const config = {
      type: Phaser.AUTO, width: 800, height: 600, parent: 'game-container', backgroundColor: '#0d1117',
      physics: { default: 'arcade', arcade: { gravity: { y: 900 }, debug: false } },
      scene: { preload: preload, create: create, update: update }
    };

    let player, floor, ceiling, obstacles, energyOrbs;
    let gravityFlipped = false, score = 0, gameActive = true;
    let scoreText, spaceKey;

    const game = new Phaser.Game(config);

    function preload() {
      let g = this.add.graphics();
      // Player
      g.fillStyle(parseInt("#00ffcc".replace("#","0x")), 1);
      g.fillRect(0, 0, 32, 32); g.generateTexture('runner_tex', 32, 32); g.clear();

      // Energy Orb
      g.fillStyle(0x4ade80, 1); g.fillCircle(14, 14, 14);
      g.generateTexture('orb_tex', 28, 28); g.clear();

      // Spike Obstacle
      g.fillStyle(0xf87171, 1); g.fillTriangle(16, 0, 0, 32, 32, 32);
      g.generateTexture('spike_tex', 32, 32); g.destroy();
    }

    function create() {
      // Platforms
      floor = this.physics.add.staticGroup();
      ceiling = this.physics.add.staticGroup();

      let g = this.add.graphics();
      g.fillStyle(0x1e293b, 1); g.fillRect(0, 0, 800, 20);
      g.generateTexture('platform_tex', 800, 20); g.destroy();

      floor.create(400, 590, 'platform_tex');
      ceiling.create(400, 10, 'platform_tex');

      player = this.physics.add.sprite(150, 530, 'runner_tex');
      player.setCollideWorldBounds(true);

      this.physics.add.collider(player, floor);
      this.physics.add.collider(player, ceiling);

      spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
      obstacles = this.physics.add.group();
      energyOrbs = this.physics.add.group();

      scoreText = this.add.text(16, 30, 'Distance / Energy: 0', { fontSize: '20px', fill: '#38bdf8', fontWeight: 'bold' });
      this.add.text(400, 30, 'PRESS SPACE TO FLIP GRAVITY UP/DOWN!', { fontSize: '16px', fill: '#fbbf24' }).setOrigin(0.5);

      this.time.addEvent({ delay: 1400, callback: spawnObstacles, callbackScope: this, loop: true });

      this.physics.add.overlap(player, energyOrbs, collectOrb, null, this);
      this.physics.add.overlap(player, obstacles, hitSpike, null, this);
    }

    function update() {
      if (!gameActive) return;

      if (Phaser.Input.Keyboard.JustDown(spaceKey)) {
        gravityFlipped = !gravityFlipped;
        this.physics.world.gravity.y = gravityFlipped ? -900 : 900;
        player.setFlipY(gravityFlipped);
      }

      score += 1;
      scoreText.setText('Distance / Energy: ' + score);
    }

    function spawnObstacles() {
      if (!gameActive) return;
      let isTop = Math.random() > 0.5;
      let y = isTop ? 40 : 560;

      if (Math.random() > 0.3) {
        let orb = energyOrbs.create(820, isTop ? 70 : 530, 'orb_tex');
        orb.body.allowGravity = false; orb.setVelocityX(-320);
      } else {
        let spike = obstacles.create(820, y, 'spike_tex');
        spike.body.allowGravity = false; spike.setVelocityX(-320);
        if (isTop) spike.setFlipY(true);
      }
    }

    function collectOrb(player, orb) {
      orb.destroy(); score += 200;
    }

    function hitSpike(player, spike) {
      gameActive = false;
      this.physics.pause();
      player.setTint(0xff0000);
      this.add.text(400, 300, 'GRAVITY RUNNER CRASHED!\nRefresh to Retry', { fontSize: '32px', fill: '#f87171', align: 'center' }).setOrigin(0.5);
    }
  </script>
</body>
</html>
