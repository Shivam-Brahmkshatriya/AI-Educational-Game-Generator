<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photosynthesis & Plant Biology Quest</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      border: 3px solid #334155;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      overflow: hidden;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game-container"></div>
  <script>
    const config = {
      type: Phaser.AUTO,
      width: 800,
      height: 600,
      parent: 'game-container',
      backgroundColor: '#0f172a',
      physics: {
        default: 'arcade',
        arcade: { gravity: { y: 150 }, debug: false }
      },
      scene: { preload: preload, create: create, update: update }
    };

    let player, cursors, itemsGroup, hazardsGroup;
    let score = 0, lives = 3;
    let scoreText, livesText, factText;
    let gameActive = true;

    const game = new Phaser.Game(config);

    function playSound(freq, duration) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + duration);
        osc.stop(ctx.currentTime + duration);
      } catch(e) {}
    }

    function preload() {
      // Generate Procedural Textures
      let g = this.add.graphics();
      
      // Player sprite texture
      g.fillStyle(parseInt("#38bdf8".replace("#","0x")), 1);
      g.fillCircle(20, 20, 20);
      g.lineStyle(3, 0xffffff, 1);
      g.strokeCircle(20, 20, 20);
      g.generateTexture('player_tex', 40, 40);
      g.clear();

      // Correct target texture
      g.fillStyle(parseInt("#4ade80".replace("#","0x")), 1);
      g.fillCircle(16, 16, 16);
      g.generateTexture('correct_tex', 32, 32);
      g.clear();

      // Hazard target texture
      g.fillStyle(parseInt("#f87171".replace("#","0x")), 1);
      g.fillRect(0, 0, 30, 30);
      g.generateTexture('hazard_tex', 30, 30);
      g.destroy();
    }

    function create() {
      // Player
      player = this.physics.add.sprite(400, 520, 'player_tex');
      player.setCollideWorldBounds(true);
      player.body.allowGravity = false;

      cursors = this.input.keyboard.createCursorKeys();

      // Item Groups
      itemsGroup = this.physics.add.group();
      hazardsGroup = this.physics.add.group();

      // HUD Text
      scoreText = this.add.text(16, 16, 'Score: 0', { fontSize: '22px', fill: '#4ade80', fontWeight: 'bold' });
      livesText = this.add.text(670, 16, 'Shields: ❤️❤️❤️', { fontSize: '20px', fill: '#f87171' });
      factText = this.add.text(400, 570, 'Fact 1: Photosynthesis is the process used by plants, algae,', { fontSize: '15px', fill: '#93c5fd' }).setOrigin(0.5);

      // Spawner timer
      this.time.addEvent({ delay: 1200, callback: spawnTargets, callbackScope: this, loop: true });

      // Collisions
      this.physics.add.overlap(player, itemsGroup, collectItem, null, this);
      this.physics.add.overlap(player, hazardsGroup, hitHazard, null, this);
    }

    function update() {
      if (!gameActive) return;

      if (cursors.left.isDown) {
        player.setVelocityX(-350);
      } else if (cursors.right.isDown) {
        player.setVelocityX(350);
      } else {
        player.setVelocityX(0);
      }
    }

    function spawnTargets() {
      if (!gameActive) return;
      let x = Phaser.Math.Between(40, 760);
      if (Math.random() > 0.35) {
        let item = itemsGroup.create(x, -20, 'correct_tex');
        item.setVelocityY(Phaser.Math.Between(150, 250));
      } else {
        let hazard = hazardsGroup.create(x, -20, 'hazard_tex');
        hazard.setVelocityY(Phaser.Math.Between(180, 280));
      }
    }

    function collectItem(player, item) {
      item.destroy();
      score += 200;
      scoreText.setText('Score: ' + score);
      playSound(600, 0.15);
    }

    function hitHazard(player, hazard) {
      hazard.destroy();
      lives--;
      playSound(150, 0.3);
      if (lives <= 0) {
        livesText.setText('Shields: ❌');
        gameActive = false;
        player.setTint(0xff0000);
        this.add.text(400, 300, 'GAME OVER
Refresh to Retry', { fontSize: '36px', fill: '#ff4757', align: 'center' }).setOrigin(0.5);
      } else {
        livesText.setText('Shields: ' + '❤️'.repeat(lives));
      }
    }
  </script>
</body>
</html>
