<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photosynthesis Defender</title>
  <style>
    body { margin: 0; padding: 0; background-color: #090d16; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    #game-container { border: 3px solid #1e293b; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); overflow: hidden; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game-container"></div>
  <script>
    const config = {
      type: Phaser.AUTO, width: 800, height: 600, parent: 'game-container', backgroundColor: '#090d16',
      physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
      scene: { preload: preload, create: create, update: update }
    };

    let player, lasers, targets, hazards, cursors, fireKey;
    let score = 0, shields = 3, lastFired = 0;
    let scoreText, shieldText, factText;
    let gameActive = true;

    const game = new Phaser.Game(config);

    function playSound(freq, duration) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq; osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + duration);
        osc.stop(ctx.currentTime + duration);
      } catch(e) {}
    }

    function preload() {
      let g = this.add.graphics();
      // Spaceship sprite (Triangle)
      g.fillStyle(parseInt("#38bdf8".replace("#","0x")), 1);
      g.fillTriangle(20, 0, 0, 40, 40, 40);
      g.generateTexture('ship_tex', 40, 40); g.clear();

      // Laser beam (Cyan rect)
      g.fillStyle(0x38bdf8, 1); g.fillRect(0, 0, 6, 16);
      g.generateTexture('laser_tex', 6, 16); g.clear();

      // Correct concept target (Circle)
      g.fillStyle(parseInt("#4ade80".replace("#","0x")), 1);
      g.fillCircle(18, 18, 18);
      g.generateTexture('target_tex', 36, 36); g.clear();

      // Hazard asteroid (Square)
      g.fillStyle(parseInt("#f87171".replace("#","0x")), 1);
      g.fillRect(0, 0, 32, 32);
      g.generateTexture('hazard_tex', 32, 32); g.destroy();
    }

    function create() {
      player = this.physics.add.sprite(400, 540, 'ship_tex');
      player.setCollideWorldBounds(true);

      cursors = this.input.keyboard.createCursorKeys();
      fireKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

      lasers = this.physics.add.group({ defaultKey: 'laser_tex', maxSize: 20 });
      targets = this.physics.add.group();
      hazards = this.physics.add.group();

      scoreText = this.add.text(16, 16, 'Score: 0', { fontSize: '22px', fill: '#4ade80', fontWeight: 'bold' });
      shieldText = this.add.text(660, 16, 'Shields: ❤️❤️❤️', { fontSize: '20px', fill: '#f87171' });
      factText = this.add.text(400, 575, 'Fact: Photosynthesis is the process used by plants, algae, a', { fontSize: '15px', fill: '#93c5fd' }).setOrigin(0.5);

      this.time.addEvent({ delay: 1300, callback: spawnWave, callbackScope: this, loop: true });

      this.physics.add.overlap(lasers, targets, destroyTarget, null, this);
      this.physics.add.overlap(lasers, hazards, destroyHazard, null, this);
      this.physics.add.overlap(player, hazards, hitPlayer, null, this);
    }

    function update(time) {
      if (!gameActive) return;

      if (cursors.left.isDown) player.setVelocityX(-400);
      else if (cursors.right.isDown) player.setVelocityX(400);
      else player.setVelocityX(0);

      if (fireKey.isDown && time > lastFired) {
        let laser = lasers.get(player.x, player.y - 20);
        if (laser) {
          laser.setActive(true).setVisible(true);
          laser.body.velocity.y = -600;
          playSound(800, 0.08);
          lastFired = time + 180;
        }
      }

      // Destroy lasers out of bounds
      lasers.children.each(function(l) {
        if (l.active && l.y < -20) l.setActive(false).setVisible(false);
      });
    }

    function spawnWave() {
      if (!gameActive) return;
      let x = Phaser.Math.Between(50, 750);
      if (Math.random() > 0.4) {
        let t = targets.create(x, -20, 'target_tex');
        t.setVelocityY(Phaser.Math.Between(100, 180));
      } else {
        let h = hazards.create(x, -20, 'hazard_tex');
        h.setVelocityY(Phaser.Math.Between(130, 220));
      }
    }

    function destroyTarget(laser, target) {
      laser.setActive(false).setVisible(false);
      target.destroy();
      score += 250;
      scoreText.setText('Score: ' + score);
      playSound(1200, 0.12);
    }

    function destroyHazard(laser, hazard) {
      laser.setActive(false).setVisible(false);
      hazard.destroy();
      score += 50;
      scoreText.setText('Score: ' + score);
      playSound(300, 0.1);
    }

    function hitPlayer(player, hazard) {
      hazard.destroy();
      shields--;
      playSound(120, 0.3);
      if (shields <= 0) {
        shieldText.setText('Shields: ❌');
        gameActive = false;
        player.setTint(0xff0000);
        this.add.text(400, 300, 'SPACE DEFENDER OVER\nRefresh to Retry', { fontSize: '34px', fill: '#ff4757', align: 'center' }).setOrigin(0.5);
      } else {
        shieldText.setText('Shields: ' + '❤️'.repeat(shields));
      }
    }
  </script>
</body>
</html>
